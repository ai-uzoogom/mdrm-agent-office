<!doctype html><html lang="ko"><meta charset="utf-8"><title>업무 자세·화면 검증</title>
<link rel="icon" href="../assets/favicon.svg">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#0c0a1d;color:#f4efe0;font:15px/1.5 monospace}h1{font-size:24px;margin:0 0 8px}p{color:#b9c4ff;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{border:1px solid #4a4383;padding:12px;background:#18152e}h2{font-size:17px;margin:0 0 10px}canvas{width:100%;height:400px;display:block}#stage{position:absolute;left:-2000px;top:0;width:1000px;height:700px}#overlay{display:none}button{margin:16px 8px 0 0;padding:10px}</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<h1>키보드 위 타이핑 · 모델에 붙은 화면</h1><p>사무실의 실제 책상·직원·노트북을 가까이서 확인합니다.</p>
<main class="grid"><article><h2>개발자 · 화면 정면</h2><canvas id="desk"></canvas></article><article><h2>개발자 · 손과 책상 높이</h2><canvas id="side"></canvas></article><article><h2>회의실 · 노트북 작업</h2><canvas id="laptop"></canvas></article></main>
<button id="step">다음 타이핑 프레임</button><button id="play">동작 재생</button>
<div id="stage"><canvas id="office"></canvas><div id="overlay"></div></div>
<script type="module">
import * as THREE from 'three';import {OfficeScene} from '../src/scene.js';
const office=new OfficeScene({canvas:document.querySelector('#office'),stage:document.querySelector('#stage'),overlay:document.querySelector('#overlay'),onLog(){},onCrew(){},onMotion(){},onReady(){}});office.reduced=true;await office.init();
office.nextCrew=Infinity;office.nextBattle=Infinity;
const views=[['desk',[-18,3.1,-11],[9,7,11],9],['side',[-18,2.8,-10.6],[12,3,0],8],['laptop',[18,3,-6.1],[8,7,10],8.5]].map(([id,center,offset,extent])=>{
 const canvas=document.getElementById(id),renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(2);renderer.setSize(canvas.clientWidth,400,false);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.BasicShadowMap;
 const aspect=canvas.clientWidth/400,camera=new THREE.OrthographicCamera(-extent*aspect/2,extent*aspect/2,extent/2,-extent/2,.1,200);camera.position.set(...center).add(new THREE.Vector3(...offset));camera.lookAt(new THREE.Vector3(...center));return {renderer,camera};
});
function render(time){office.elapsed=time;office.update(1/60);office.scene.updateMatrixWorld(true);for(const {renderer,camera} of views)renderer.render(office.scene,camera);}
function handBounds(actor,side){
 const bone=actor.bones['arm-'+side],points=[],point=new THREE.Vector3(),bind=new THREE.Vector3();
 actor.root.updateMatrixWorld(true);actor.model.traverse(mesh=>{
  if(!mesh.isSkinnedMesh)return;mesh.skeleton.update();const joint=mesh.skeleton.bones.indexOf(bone);if(joint<0)return;
  const {position,skinIndex,skinWeight}=mesh.geometry.attributes;
  for(const i of new Set(mesh.geometry.index.array))for(let k=0;k<4;k++){
   if(skinIndex.getComponent(i,k)!==joint||skinWeight.getComponent(i,k)<.9)continue;
   bind.fromBufferAttribute(position,i).applyMatrix4(mesh.bindMatrix).applyMatrix4(mesh.skeleton.boneInverses[joint]);
   if(Math.abs(bind.x)>.22){mesh.getVertexPosition(i,point).applyMatrix4(mesh.matrixWorld);points.push(point.clone());}break;
  }
 });return new THREE.Box3().setFromPoints(points);
}
const actors=[...office.crewActors.slice(0,4),office.meeting],samples=[];
for(let i=0;i<50;i++){
 render(i/30);
 samples.push(actors.map((a,j)=>({hands:['left','right'].map(side=>({position:a.hands[side].getWorldPosition(new THREE.Vector3()).toArray(),minimum:handBounds(a,side).min.toArray(),maximum:handBounds(a,side).max.toArray(),scale:a.bones['arm-'+side].scale.toArray()})),keyboard:j<4?new THREE.Box3().setFromObject(a.keyboard):{min:new THREE.Vector3(16.7,3.3,-6.4),max:new THREE.Vector3(19.3,3.43,-5.3)},hips:a.bones.torso.getWorldPosition(new THREE.Vector3()).toArray()})));
}
const displayReports=office.displays.map(display=>{
 const pixels=time=>{display.update(time);return Array.from(display.canvas.getContext('2d').getImageData(0,0,256,160).data);},before=pixels(0),after=pixels(1.3);
 display.mesh.updateWorldMatrix(true,false);const corners=[[-.5,-.5],[.5,-.5],[-.5,.5],[.5,.5]].map(([x,y])=>new THREE.Vector3(x*display.mesh.geometry.parameters.width,y*display.mesh.geometry.parameters.height,0).applyMatrix4(display.mesh.matrixWorld).toArray());
 const normal=new THREE.Vector3(0,0,1).applyNormalMatrix(new THREE.Matrix3().getNormalMatrix(display.mesh.matrixWorld));
 const contact=[[0,0],[-.47,-.47],[.47,-.47],[-.47,.47],[.47,.47]].map(([x,y])=>{
  const point=new THREE.Vector3(x*display.mesh.geometry.parameters.width,y*display.mesh.geometry.parameters.height,0).applyMatrix4(display.mesh.matrixWorld);
  const ray=new THREE.Raycaster(point.clone().addScaledVector(normal,.2),normal.clone().negate(),0,1),hit=ray.intersectObject(display.surface,true).find(h=>h.object!==display.mesh);
  return hit?{gap:hit.point.distanceTo(point),alignment:hit.face.normal.clone().applyNormalMatrix(new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld)).dot(normal)}:null;
 });
 let changedPixels=0;for(let i=0;i<after.length;i+=4)if(after.slice(i,i+4).some((v,j)=>v!==before[i+j]))changedPixels++;
 return {name:display.mesh.name,parent:display.surface.name,corners,changedPixels,contact,normal:normal.toArray(),point:display.mesh.getWorldPosition(new THREE.Vector3()).toArray()};
});
office.nextCode=0;render(.25);window.__WORKSTATION_REVIEW__={samples,displays:displayReports};document.documentElement.dataset.reviewReady='true';
let time=.25,playing=false,last=0;function animate(now){if(!playing)return;time+=Math.min(.06,(now-last)/1000||0);last=now;render(time);requestAnimationFrame(animate);}document.querySelector('#step').onclick=()=>{time+=.14;render(time);};document.querySelector('#play').onclick=()=>{playing=!playing;last=0;document.querySelector('#play').textContent=playing?'동작 정지':'동작 재생';if(playing)requestAnimationFrame(animate);};
</script></html>
