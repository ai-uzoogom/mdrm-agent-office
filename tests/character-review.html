<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>MDRM 캐릭터 장비 검증</title>
<link rel="icon" href="../assets/favicon.svg">
<style>
@font-face{font-family:Korean;src:url('../assets/fonts/NanumGothicCoding-Regular.ttf')}
*{box-sizing:border-box}body{margin:0;padding:28px;background:#0c0a1d;color:#f4efe0;font:16px/1.6 Korean,monospace}h1{font-size:25px;margin:0}p{color:#b9c4ff;margin:4px 0 22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}article{background:#18152e;border:1px solid #4a4383;padding:14px}h2{font-size:17px;margin:0}article p{font-size:13px;min-height:42px;margin:8px 0}canvas{width:100%;height:370px;display:block}.foot{font-size:12px;margin-top:18px}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/addons/"}}</script>
<h1>영웅 장비 수정 · 일정 독려 담당 추가</h1>
<p>실제 모델과 동작별 정지 프레임 · Kenney CC0 에셋</p>
<main class="grid">
<article><h2>대기</h2><p>투구·갑옷 맞춤<br>손에 연결된 검과 방패</p><canvas id="idle"></canvas></article>
<article><h2>반격</h2><p>팔과 함께 검 휘두르기<br>손잡이는 손에 고정</p><canvas id="attack"></canvas></article>
<article><h2>방어</h2><p>왼팔을 앞으로 들어 올리기<br>방패도 같은 관절을 따라 이동</p><canvas id="guard"></canvas></article>
<article><h2>일정 독려</h2><p>“커밋 준비됐나요?”<br>입 앞으로 가져온 확성기</p><canvas id="coordinator"></canvas></article>
</main>
<p class="foot">독립 렌더 검증 화면입니다. 사무실에서도 동일한 모델·장비·동작을 사용합니다.</p>
<script type="module">
import * as THREE from 'three';
import {loadAssets,hero,crewCharacter} from '../src/models.js';
import {CREW} from '../src/data.js';
await loadAssets();
const heroes=[hero(),hero(),hero()];
heroes[1].setEquipmentPose(1,0);heroes[2].setEquipmentPose(0,1);
const coordinator=crewCharacter(CREW.find(p=>p.behavior==='encourage'),6);coordinator.setEncouragementPose(.3,true);
const actors=[...heroes,coordinator],reports=[];
for(const [i,id] of ['idle','attack','guard','coordinator'].entries()){
 const actor=actors[i];actor.root.rotation.y=i===3?0:Math.PI/2;
 actor.root.updateMatrixWorld(true);
 const canvas=document.getElementById(id),renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:true});
 renderer.setPixelRatio(2);renderer.setSize(canvas.clientWidth,370,false);renderer.outputColorSpace=THREE.SRGBColorSpace;
 const scene=new THREE.Scene();scene.background=new THREE.Color('#18152e');scene.add(actor.root);
 scene.add(new THREE.HemisphereLight('#fff1da','#6d6595',2.25));const sun=new THREE.DirectionalLight('#ffe6c7',3.4);sun.position.set(-25,65,35);scene.add(sun);
 const center=i===3?new THREE.Box3().setFromObject(actor.root).getCenter(new THREE.Vector3()):new THREE.Vector3(0,3,0),extent=10,aspect=canvas.clientWidth/370,camera=new THREE.OrthographicCamera(-extent*aspect/2,extent*aspect/2,extent/2,-extent/2,.1,100);
 camera.position.copy(center).add(new THREE.Vector3(10,8,12));camera.lookAt(center);renderer.render(scene,camera);
 reports.push({id,bounds:new THREE.Box3().setFromObject(actor.root).getSize(new THREE.Vector3()).toArray(),gearFloorMin:actor.sword?Math.min(new THREE.Box3().setFromObject(actor.sword).min.y,new THREE.Box3().setFromObject(actor.shield).min.y):null,sword:actor.sword?.getWorldPosition(new THREE.Vector3()).toArray(),shield:actor.shield?.getWorldPosition(new THREE.Vector3()).toArray()});
}
const animated=hero(),anchors={sword:animated.sword.position.toArray(),shield:animated.shield.position.toArray()},frames=[];
for(const action of ['idle','walk','attack-melee-right','holding-left']){
 animated.setAction(action);
 for(let i=0;i<15;i++){
  animated.mixer.update(1/30);animated.root.updateMatrixWorld(true);
  frames.push({action,sword:animated.sword.position.toArray(),shield:animated.shield.position.toArray(),swordWorld:animated.sword.getWorldPosition(new THREE.Vector3()).toArray(),shieldWorld:animated.shield.getWorldPosition(new THREE.Vector3()).toArray()});
 }
}
const mouthSamples=[],handAnchor=coordinator.phone.position.toArray(),armScale=coordinator.bones['arm-right'].scale.toArray();
for(const yaw of [0,Math.PI/2,-Math.PI/2])for(let i=0;i<30;i++){
 coordinator.root.rotation.y=yaw;coordinator.root.position.set(4,0,-6);coordinator.mixer.update(1/30);coordinator.setEncouragementPose(i/30,true);coordinator.root.updateMatrixWorld(true);
 mouthSamples.push({gap:coordinator.mouth.getWorldPosition(new THREE.Vector3()).distanceTo(coordinator.mouthpiece.getWorldPosition(new THREE.Vector3())),hand:coordinator.phone.position.toArray(),armScale:coordinator.bones['arm-right'].scale.toArray()});
}
window.__CHARACTER_REVIEW__={reports,anchors,frames,mouthSamples,handAnchor,armScale,headVisible:animated.model.getObjectByName('head-mesh').visible,swordParent:animated.sword.parent.name,shieldParent:animated.shield.parent.name,female:coordinator.filename,phoneParent:coordinator.phone.parent.name,waves:coordinator.waves.visible};
await document.fonts.ready;document.documentElement.dataset.reviewReady='true';
</script>
</html>
